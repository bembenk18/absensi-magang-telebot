services:
  absensi-bot:
    build: .
    container_name: absensi-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Jakarta
    volumes:
      # Data persisten agar database, foto, dan laporan tidak hilang saat container restart/update
      - ./attendance.db:/app/attendance.db
      - ./photos:/app/photos
      - ./reports:/app/reports
      - ./.env:/app/.env
