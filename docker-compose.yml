version: '3.3'

services:
  absensi-bot:
    build:
      context: .
      args:
        UID: 1000
        GID: 1000
    container_name: absensi-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Jakarta
    volumes:
      # Data persisten agar database, foto, dan laporan tidak hilang saat container restart/update
      - ./attendance.db:/app/attendance.db
      - ./photos:/app/photos
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
